[package]
name = "web-remote"
version = "0.1.0"
edition = "2021"
description = "Serve a secure, token-guarded web UI to send multimedia keys (play/stop/volume) to the local Linux (GNOME/Wayland) host."
license = "Apache-2.0"
documentation = "https://docs.rs/web-remote"
homepage = "https://github.com/simon3z/web-remote"
repository = "https://github.com/simon3z/web-remote"
readme = "README.md"

[[bin]]
name = "web-remote"
path = "src/bin/main.rs"

[lib]
name = "web_remote"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rcgen = "0.13"
qrcode = "0.14"
base64 = "0.22"
anyhow = "1"
url = "2"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Key delivery (feature-gated so the no-sink build stays light)
# enigo 0.4: the Wayland backend no longer logs a WARN for every seat
# capability event (the 0.3 backend had no Dispatch impl for wl_seat and fell
# through to a catch-all that warned). `default-features = false` drops the
# xdo backend (needs libXdo at link time). The x11rb feature is kept as a
# fallback: on some GNOME sessions the virtual-keyboard protocol is not
# available, but XWayland apps still receive keys via the X11 fake-input path.
enigo = { version = "0.4", optional = true, default-features = false, features = ["wayland", "x11rb"] }
evdev = { version = "0.13", optional = true }
nix = { version = "0.29", optional = true, features = ["user", "process"] }

[features]
default = ["wayland-sink"]
wayland-sink = ["dep:enigo"]
evdev-sink = ["dep:evdev", "dep:nix"]

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
